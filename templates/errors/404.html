{% extends 'base.html' %}
{% block title %}404 Not Found - Surplus Food Redistribution System{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card border-0 shadow-sm rounded-4 p-5 bg-white">
        <i class="fa-solid fa-utensils fa-4x text-muted opacity-50 mb-3"></i>
        <h2 class="fw-bold text-dark">404 - Page Not Found</h2>
        <p class="text-secondary mb-4">
          The requested donation listing or operational resource could not be found or may have expired.
        </p>
        <div>
          <a href="{{ url_for('available_food') }}" class="btn btn-outline-success fw-bold px-4 me-2">
            Browse Available Food
          </a>
          <a href="{{ url_for('index') }}" class="btn btn-success fw-bold px-4">
            Home
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
