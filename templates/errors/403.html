{% extends 'base.html' %}
{% block title %}403 Forbidden - Surplus Food Redistribution System{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card border-0 shadow-sm rounded-4 p-5 bg-white">
        <i class="fa-solid fa-ban fa-4x text-danger mb-3"></i>
        <h2 class="fw-bold text-dark">403 - Access Prohibited</h2>
        <p class="text-secondary mb-4">
          You do not have the required role privileges or verification status to access this resource.
        </p>
        <div>
          <a href="{{ url_for('index') }}" class="btn btn-success fw-bold px-4">
            <i class="fa-solid fa-house me-1"></i> Return to Safety
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
